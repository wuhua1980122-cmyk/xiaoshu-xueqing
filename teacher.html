<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学情看板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system,"Microsoft YaHei",sans-serif; background:#f5f6fa; color:#2d3436; min-height:100vh; }

  .header { background:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 4px rgba(0,0,0,.06); position:sticky; top:0; z-index:10; }
  .header h1 { font-size:20px; font-weight:700; }
  .header-actions { display:flex; gap:8px; }
  .btn { padding:8px 16px; border:none; border-radius:4px; font-size:13px; cursor:pointer; font-weight:500; }
  .btn-primary { background:#6c5ce7; color:#fff; }
  .btn-primary:hover { background:#5a4bd1; }
  .btn-danger { background:#e17055; color:#fff; }
  .btn-danger:hover { background:#d65f45; }
  .btn-outline { background:#fff; border:1px solid #ddd; color:#555; }

  .container { max-width:1280px; margin:0 auto; padding:20px; }

  .student-url { background:#dfe6e9; padding:8px 16px; border-radius:4px; font-size:13px; display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .student-url code { font-family:monospace; font-size:14px; font-weight:600; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:#fff; border-radius:8px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); text-align:center; }
  .card .num { font-size:26px; font-weight:700; color:#6c5ce7; }
  .card .label { font-size:11px; color:#636e72; margin-top:4px; }
  .card.alert .num { color:#e17055; }

  .section { background:#fff; border-radius:8px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .section h2 { font-size:15px; font-weight:600; margin-bottom:10px; color:#2d3436; }

  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; padding:7px 5px; border-bottom:2px solid #dfe6e9; color:#636e72; font-weight:600; font-size:11px; }
  td { padding:7px 5px; border-bottom:1px solid #f1f2f6; }
  tr:hover td { background:#f8f9ff; }
  tr.expandable { cursor:pointer; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:3px; }
  .dot.on { background:#00b894; }
  .dot.off { background:#b2bec3; }
  .score-bar { width:50px; height:5px; background:#dfe6e9; border-radius:3px; display:inline-block; vertical-align:middle; margin-right:4px; }
  .score-fill { height:100%; border-radius:3px; }
  .detail-row { background:#f8f9ff; }
  .detail-row td { padding:10px 16px; font-size:12px; }
  .detail-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media(max-width:768px) { .detail-grid { grid-template-columns:1fr; } }
  .detail-box { background:#fff; border:1px solid #e2e8f0; border-radius:6px; padding:10px; }
  .detail-box h4 { font-size:11px; color:#636e72; margin-bottom:6px; }
  .detail-item { display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }

  .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  @media(max-width:768px) { .charts-row { grid-template-columns:1fr; } }

  .kp-bar { display:flex; align-items:center; gap:6px; margin-bottom:7px; }
  .kp-bar .kp-name { width:70px; font-size:11px; text-align:right; color:#636e72; flex-shrink:0; }
  .kp-bar .kp-track { flex:1; height:12px; background:#f1f2f6; border-radius:3px; overflow:hidden; }
  .kp-bar .kp-fill { height:100%; background:#6c5ce7; border-radius:3px; transition:width .3s; }
  .kp-bar .kp-val { width:34px; font-size:11px; font-weight:600; text-align:right; }

  .orp-bar { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .orp-bar .orp-label { width:80px; font-size:11px; text-align:right; color:#636e72; }
  .orp-bar .orp-track { flex:1; height:14px; background:#f1f2f6; border-radius:3px; overflow:hidden; position:relative; }
  .orp-bar .orp-count { position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:10px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.3); }
  .orp-bar .orp-fill { height:100%; border-radius:3px; transition:width .3s; }

  #radar-canvas { display:block; margin:0 auto; }

  .rank-item { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .rank-item .rank-num { width:18px; font-size:11px; font-weight:700; color:#6c5ce7; text-align:center; }
  .rank-item .rank-name { width:54px; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-item .rank-track { flex:1; height:8px; background:#f1f2f6; border-radius:3px; overflow:hidden; }
  .rank-item .rank-fill { height:100%; border-radius:3px; transition:width .3s; }
  .rank-item .rank-val { width:28px; font-size:11px; font-weight:600; text-align:right; }

  .conclusion { background:#f8f9ff; border-left:3px solid #6c5ce7; padding:12px 16px; border-radius:0 4px 4px 0; font-size:13px; line-height:1.6; }
  .conclusion strong { color:#6c5ce7; }

  .event-item { padding:3px 8px; border-bottom:1px solid #f1f2f6; font-size:11px; font-family:monospace; }
  .event-item .ev-time { color:#b2bec3; margin-right:6px; }
  .event-item .ev-name { font-weight:600; }
  .event-item .ev-type { color:#6c5ce7; }

  .footer { text-align:center; padding:14px; font-size:11px; color:#b2bec3; }
</style>
</head>
<body>

<div class="header">
  <h1>学情看板</h1>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="copyStudentUrl()">复制学生端地址</button>
    <button class="btn btn-primary" onclick="exportCSV()">导出 CSV</button>
    <button class="btn btn-danger" onclick="resetClass()">清堂重置</button>
  </div>
</div>

<div class="container">

  <div class="student-url">
    <span>学生端地址：</span>
    <code id="student-url-display">-</code>
    <button class="btn btn-outline" style="padding:4px 10px;font-size:11px" onclick="copyStudentUrl()">复制</button>
  </div>

  <div class="cards" id="summary-cards">
    <div class="card"><div class="num" id="c-online">0</div><div class="label">在线学生</div></div>
    <div class="card"><div class="num" id="c-avg">-</div><div class="label">综合均分</div></div>
    <div class="card"><div class="num" id="c-pass">-</div><div class="label">达标率 ≥60</div></div>
    <div class="card"><div class="num" id="c-excel">-</div><div class="label">优秀率 ≥85</div></div>
    <div class="card alert"><div class="num" id="c-warn">0</div><div class="label">需关注</div></div>
    <div class="card"><div class="num" id="c-total">0</div><div class="label">总人数</div></div>
    <div class="card"><div class="num" id="c-interact">-</div><div class="label">总交互</div></div>
    <div class="card alert"><div class="num" id="c-idle">0</div><div class="label">挂机 >60s</div></div>
    <div class="card"><div class="num" id="c-mastered">-</div><div class="label">自评已掌握</div></div>
    <div class="card alert"><div class="num" id="c-review">-</div><div class="label">自评需复习</div></div>
  </div>

  <div class="section">
    <h2>学生实时进度 <span style="font-size:11px;color:#b2bec3;font-weight:normal">（点击行展开详情）</span></h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>姓名</th><th>状态</th><th>进度</th><th>提示</th><th>答案</th><th>失败</th><th>完成</th><th>交互</th><th>活跃</th><th>综合评分</th></tr>
        </thead>
        <tbody id="student-tbody">
          <tr><td colspan="10" style="text-align:center;color:#b2bec3;padding:24px">等待学生接入…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="charts-row">
    <div class="section">
      <h2>最终 ORP 读数分布</h2>
      <div id="orp-dist"><p style="color:#b2bec3;font-size:13px">暂无数据</p></div>
    </div>
    <div class="section">
      <h2>知识点掌握度</h2>
      <div id="kp-charts"><p style="color:#b2bec3;font-size:13px">暂无数据</p></div>
    </div>
  </div>

  <div class="charts-row">
    <div class="section">
      <h2>六维能力</h2>
      <canvas id="radar-canvas" width="300" height="300"></canvas>
    </div>
    <div class="section">
      <h2>综合评分排行</h2>
      <div id="ranking"><p style="color:#b2bec3;font-size:13px">暂无数据</p></div>
    </div>
  </div>

  <div class="section">
    <h2>实时事件流</h2>
    <div id="event-stream" style="max-height:180px;overflow-y:auto;">
      <p style="color:#b2bec3;font-size:12px">暂无事件</p>
    </div>
  </div>

  <div class="section">
    <h2>学情结论</h2>
    <div class="conclusion" id="conclusion">暂无数据，等待学生接入后自动生成。</div>
  </div>

</div>

<div class="footer">数据仅存教师电脑内存 · 不上传外部服务器 · 重启服务即清空 · 只作教学参考</div>

<script>
(function(){
  'use strict';
  var POLL = 2000;
  var radarDims = ['独立度','准确度','推进度','活跃度','参与度','自主性'];
  var expanded = {};

  var localUrl = location.origin + '/';
  var urlEl = document.getElementById('student-url-display');
  urlEl.textContent = localUrl;
  if (location.protocol === 'file:') {
    urlEl.style.color = '#e17055';
    urlEl.textContent = '[错误] 请通过 http://localhost:8080/teacher.html 访问';
  }

  function copyStudentUrl() { navigator.clipboard.writeText(localUrl).then(function(){ alert('已复制：' + localUrl); }); }
  function exportCSV() { window.open('/api/export-csv','_blank'); }
  function resetClass() { if(!confirm('确定清空所有学情数据？'))return; fetch('/api/reset',{method:'POST'}).then(function(){ poll(); }); }

  function poll() {
    fetch('/api/students').then(function(r){return r.json();}).then(renderAll).catch(function(){});
  }
  setInterval(poll, POLL); poll();

  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  function fmtTime(ts){if(!ts)return '-';var d=new Date(ts);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');}
  function fmtDur(ms){if(!ms)return '-';var s=Math.round(ms/1000);if(s<60)return s+'s';return Math.floor(s/60)+'m'+(s%60)+'s';}

  function renderAll(list){
    var active = list.filter(function(s){return s.counters&&(s.counters.hints+s.counters.answers+s.counters.errors+s.counters.completions)>0;});
    var online = list.filter(function(s){return s.online;}).length;
    var idleCount = 0, totalInteract = 0;
    list.forEach(function(s){
      if(s.activity && s.activity.idle_secs > 60) idleCount++;
      if(s.counters && s.counters.interactions) totalInteract += s.counters.interactions;
    });

    document.getElementById('c-online').textContent = online;
    document.getElementById('c-total').textContent = list.length;
    document.getElementById('c-interact').textContent = totalInteract || '-';
    document.getElementById('c-idle').textContent = idleCount;

    var qm=0,qb=0,qr=0;
    list.forEach(function(s){
      if(s.quiz_result){
        if(s.quiz_result.level==='mastered')qm++;
        else if(s.quiz_result.level==='need_review')qr++;
        else qb++;
      }
    });
    document.getElementById('c-mastered').textContent=qm||'-';
    document.getElementById('c-review').textContent=qr||'-';

    if(active.length>0){
      var scores=active.map(function(s){return s.score;});
      document.getElementById('c-avg').textContent=Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length);
      document.getElementById('c-pass').textContent=Math.round(scores.filter(function(s){return s>=60;}).length/active.length*100)+'%';
      document.getElementById('c-excel').textContent=Math.round(scores.filter(function(s){return s>=85;}).length/active.length*100)+'%';
      document.getElementById('c-warn').textContent=scores.filter(function(s){return s<60;}).length;
    } else {
      document.getElementById('c-avg').textContent='-';
      document.getElementById('c-pass').textContent='-';
      document.getElementById('c-excel').textContent='-';
      document.getElementById('c-warn').textContent='0';
    }

    renderTable(list);
    renderOrpDist(list);
    renderKP(list);
    renderRadar(list);
    renderRanking(list);
    renderEvents(list);
    renderConclusion(list);
  }

  function renderTable(list){
    var tbody=document.getElementById('student-tbody');
    if(list.length===0){tbody.innerHTML='<tr><td colspan="10" style="text-align:center;color:#b2bec3;padding:24px">等待学生接入…</td></tr>';return;}
    var html='';
    list.forEach(function(s){
      var c=s.counters||{},p=s.progress||{},a=s.activity||{};
      var sc=s.score||0;
      var scColor=sc>=85?'#00b894':sc>=60?'#6c5ce7':'#e17055';
      var idle=a.idle_secs||0;
      var idleCls=idle>60?'color:#e17055;font-weight:700':'';
      html+='<tr class="expandable" onclick="toggleDetail(\''+s.id+'\')">'
        +'<td>'+esc(s.name)+'</td>'
        +'<td><span class="dot '+(s.online?'on':'off')+'"></span>'+(s.online?'在线':'离线')+'</td>'
        +'<td>'+(p.total>0?(p.current+'/'+p.total):'-')+'</td>'
        +'<td>'+(c.hints||0)+'</td>'
        +'<td>'+(c.answers||0)+'</td>'
        +'<td>'+(c.errors||0)+'</td>'
        +'<td>'+(c.completions||0)+'</td>'
        +'<td>'+(c.interactions||0)+'</td>'
        +'<td style="'+idleCls+'">'+Math.round((a.active_ratio||0)*100)+'%</td>'
        +'<td><span class="score-bar"><span class="score-fill" style="width:'+sc+'%;background:'+scColor+'"></span></span>'+sc+'</td>'
        +'</tr>';
      if(expanded[s.id]){
        var cust=s.custom||{};
        var evts=s.event_log||[];
        var recentEvts=evts.slice(-8).reverse();
        var dur=Date.now()-(s.page_load||Date.now());
        html+='<tr class="detail-row"><td colspan="10"><div class="detail-grid">'
          +'<div class="detail-box"><h4>会话信息</h4>'
          +'<div class="detail-item"><span>总停留</span><span>'+fmtDur(dur)+'</span></div>'
          +'<div class="detail-item"><span>活跃占比</span><span>'+Math.round((a.active_ratio||0)*100)+'%</span></div>'
          +'<div class="detail-item"><span>当前空闲</span><span>'+idle+'s</span></div>'
          +'<div class="detail-item"><span>最后活跃</span><span>'+fmtTime(a.last_active)+'</span></div></div>'
          +'<div class="detail-box"><h4>自定义数据</h4>'
          +Object.keys(cust).map(function(k){return '<div class="detail-item"><span>'+esc(k)+'</span><span>'+esc(cust[k])+'</span></div>';}).join('')
          +'</div>'
          +'<div class="detail-box"><h4>最近事件</h4>'
          +(recentEvts.length?recentEvts.map(function(e){return '<div class="detail-item"><span style="color:#b2bec3">'+fmtTime(e.ts)+'</span><span class="ev-type">'+esc(e.e)+'</span></div>';}).join(''):'<span style="color:#b2bec3">无</span>')
          +'</div></div></td></tr>';
      }
    });
    tbody.innerHTML=html;
  }

  window.toggleDetail=function(id){expanded[id]=!expanded[id];poll();};

  function renderOrpDist(list){
    var el=document.getElementById('orp-dist');
    var orps={};
    list.forEach(function(s){
      if(s.custom&&s.custom.final_orp!=null){
        var v=s.custom.final_orp;
        orps[v]=(orps[v]||0)+1;
      }
    });
    var keys=Object.keys(orps).map(Number).sort(function(a,b){return a-b;});
    if(keys.length===0){el.innerHTML='<p style="color:#b2bec3;font-size:13px">暂无数据（需学生触发 setRatio 后才有 ORP 读数）</p>';return;}
    var maxCount=Math.max.apply(null,keys.map(function(k){return orps[k];}));
    var colors=['#38bdf8','#34d399','#fbbf24','#ef4444'];
    el.innerHTML=keys.map(function(k,i){
      var w=Math.round(orps[k]/maxCount*100);
      var col=colors[i%colors.length]||'#6c5ce7';
      return '<div class="orp-bar"><span class="orp-label">'+k+' mV</span><div class="orp-track"><div class="orp-fill" style="width:'+w+'%;background:'+col+'"></div><span class="orp-count">'+orps[k]+' 人</span></div></div>';
    }).join('');
  }

  function renderKP(list){
    var el=document.getElementById('kp-charts');
    var dims=[
      {label:'独立度',fn:function(s){var c=s.counters||{};return Math.max(0,1-(c.hints+c.answers*2.5)/6)*100;}},
      {label:'准确度',fn:function(s){var c=s.counters||{};return Math.max(0,1-(c.errors)/(c.errors+3))*100;}},
      {label:'推进度',fn:function(s){var p=s.progress||{},c=s.counters||{};return p.total>0?c.completions/p.total*100:0;}},
      {label:'活跃度',fn:function(s){var a=s.activity||{};return (a.active_ratio||0)*100;}},
      {label:'参与度',fn:function(s){var c=s.counters||{};return Math.min(100,(c.interactions||0)*5);}},
      {label:'自主性',fn:function(s){var c=s.counters||{};return (1-Math.min(1,(c.answers||0)/3))*100;}},
    ];
    var active=list.filter(function(s){return s.counters&&(s.counters.hints+s.counters.answers+s.counters.errors+s.counters.completions)>0;});
    if(active.length===0){el.innerHTML='<p style="color:#b2bec3;font-size:13px">暂无数据</p>';return;}
    el.innerHTML=dims.map(function(d){
      var avg=Math.round(active.reduce(function(a,s){return a+d.fn(s);},0)/active.length);
      return '<div class="kp-bar"><span class="kp-name">'+d.label+'</span><div class="kp-track"><div class="kp-fill" style="width:'+avg+'%"></div></div><span class="kp-val">'+avg+'%</span></div>';
    }).join('');
  }

  function renderRadar(list){
    var cv=document.getElementById('radar-canvas'),cx2d=cv.getContext('2d');
    var cx=150,cy=150,R=105;
    cx2d.clearRect(0,0,300,300);
    cx2d.strokeStyle='#dfe6e9';cx2d.lineWidth=1;
    for(var ring=1;ring<=4;ring++){
      cx2d.beginPath();
      for(var i=0;i<=6;i++){
        var an=Math.PI*2/6*i-Math.PI/2;
        var x=cx+R*ring/4*Math.cos(an),y=cy+R*ring/4*Math.sin(an);
        i===0?cx2d.moveTo(x,y):cx2d.lineTo(x,y);
      }
      cx2d.stroke();
    }
    cx2d.fillStyle='#636e72';cx2d.font='10px sans-serif';cx2d.textAlign='center';
    for(var i=0;i<6;i++){
      var an=Math.PI*2/6*i-Math.PI/2;
      var lx=cx+(R+16)*Math.cos(an),ly=cy+(R+16)*Math.sin(an);
      cx2d.beginPath();cx2d.moveTo(cx,cy);cx2d.lineTo(cx+R*Math.cos(an),cy+R*Math.sin(an));cx2d.strokeStyle='#dfe6e9';cx2d.stroke();
      cx2d.fillText(radarDims[i],lx,ly+4);
    }
    var active=list.filter(function(s){return s.counters&&(s.counters.hints+s.counters.answers+s.counters.errors+s.counters.completions)>0;});
    if(active.length===0)return;
    var fnArr=[
      function(s){var c=s.counters||{};return Math.max(0,1-(c.hints+c.answers*2.5)/6)*100;},
      function(s){var c=s.counters||{};return Math.max(0,1-(c.errors)/(c.errors+3))*100;},
      function(s){var p=s.progress||{},c=s.counters||{};return p.total>0?c.completions/p.total*100:0;},
      function(s){var a=s.activity||{};return (a.active_ratio||0)*100;},
      function(s){var c=s.counters||{};return Math.min(100,(c.interactions||0)*5);},
      function(s){var c=s.counters||{};return (1-Math.min(1,(c.answers||0)/3))*100;}
    ];
    var avgVals=fnArr.map(function(fn){return Math.round(active.reduce(function(a,s){return a+fn(s);},0)/active.length);});
    cx2d.beginPath();
    avgVals.forEach(function(v,i){
      var an=Math.PI*2/6*i-Math.PI/2;
      var r=R*v/100;
      var x=cx+r*Math.cos(an),y=cy+r*Math.sin(an);
      i===0?cx2d.moveTo(x,y):cx2d.lineTo(x,y);
    });
    cx2d.closePath();
    cx2d.strokeStyle='#fdcb6e';cx2d.lineWidth=2;cx2d.setLineDash([5,3]);cx2d.stroke();cx2d.setLineDash([]);
    cx2d.fillStyle='rgba(253,203,110,0.12)';cx2d.fill();
  }

  function renderRanking(list){
    var el=document.getElementById('ranking');
    var sorted=list.slice().sort(function(a,b){return (b.score||0)-(a.score||0);});
    if(sorted.length===0){el.innerHTML='<p style="color:#b2bec3;font-size:13px">暂无数据</p>';return;}
    el.innerHTML=sorted.slice(0,20).map(function(s,i){
      var col=(s.score||0)>=85?'#00b894':(s.score||0)>=60?'#6c5ce7':'#e17055';
      return '<div class="rank-item"><span class="rank-num">'+(i+1)+'</span><span class="rank-name">'+esc(s.name)+'</span><div class="rank-track"><div class="rank-fill" style="width:'+(s.score||0)+'%;background:'+col+'"></div></div><span class="rank-val">'+(s.score||0)+'</span></div>';
    }).join('');
  }

  function renderEvents(list){
    var el=document.getElementById('event-stream');
    var allEvts=[];
    list.forEach(function(s){
      (s.event_log||[]).forEach(function(e){allEvts.push({name:s.name,e:e.e,d:e.d,ts:e.ts});});
    });
    allEvts.sort(function(a,b){return b.ts-a.ts;});
    allEvts=allEvts.filter(function(e){return Date.now()-e.ts<30000;}).slice(0,30);
    if(allEvts.length===0){el.innerHTML='<p style="color:#b2bec3;font-size:12px">暂无事件</p>';return;}
    el.innerHTML=allEvts.map(function(e){
      var extra=e.d&&e.d.task?' ('+esc(e.d.task)+')':'';
      return '<div class="event-item"><span class="ev-time">'+fmtTime(e.ts)+'</span><span class="ev-name">'+esc(e.name)+'</span> <span class="ev-type">'+esc(e.e)+'</span>'+extra+'</div>';
    }).join('');
  }

  function renderConclusion(list){
    var el=document.getElementById('conclusion');
    var active=list.filter(function(s){return s.counters&&(s.counters.hints+s.counters.answers+s.counters.errors+s.counters.completions)>0;});
    if(active.length===0){el.textContent='暂无数据，等待学生接入后自动生成。';return;}
    var sorted=active.slice().sort(function(a,b){return b.score-a.score;});
    var top=sorted[0],bottom=sorted[sorted.length-1];
    var totalHints=active.reduce(function(a,s){return a+(s.counters.hints||0);},0);
    var totalAnswers=active.reduce(function(a,s){return a+(s.counters.answers||0);},0);
    var totalErrors=active.reduce(function(a,s){return a+(s.counters.errors||0);},0);
    var totalInteract=active.reduce(function(a,s){return a+(s.counters.interactions||0);},0);
    var idleCount=active.filter(function(s){return s.activity&&s.activity.idle_secs>60;}).length;

    var orps=active.filter(function(s){return s.custom&&s.custom.final_orp!=null;}).map(function(s){return s.custom.final_orp;});
    var peakCount=orps.filter(function(v){return v>=650;}).length;

    var qm=active.filter(function(s){return s.quiz_result&&s.quiz_result.level==='mastered';}).length;
    var qr=active.filter(function(s){return s.quiz_result&&s.quiz_result.level==='need_review';}).length;
    var qc=active.filter(function(s){return s.quiz_result;}).length;

    var lines=[];
    lines.push('本班 <strong>'+active.length+'</strong> 人有学习行为，累计交互 <strong>'+totalInteract+'</strong> 次'+(idleCount>0?'，<strong>'+idleCount+'</strong> 人挂机超 60s':'')+'.');
    lines.push('最佳：<strong>'+top.name+'</strong>（'+top.score+'分）；需关注：<strong>'+bottom.name+'</strong>（'+bottom.score+'分）。');
    if(qc>0){
      lines.push('自评分布：已掌握 <strong>'+qm+'</strong> / 基本 '+ (qc-qm-qr) +' / 需复习 <strong>'+qr+'</strong>（共 '+qc+' 人提交）。');
      if(qr>active.length*0.3){
        lines.push('<strong>'+qr+' 人需复习</strong>，建议下节课优先回顾这些学生标记的难点。');
      }
    }
    if(orps.length>0&&peakCount<orps.length/2){
      lines.push('仅 <strong>'+peakCount+' / '+orps.length+'</strong> 人触及 ORP 峰值区（≥650mV），建议投屏带过 1:10³ 阶段。');
    }
    if(totalAnswers>totalHints){
      lines.push('答案查看（'+totalAnswers+'）多于提示（'+totalHints+'），建议降低答案依赖。');
    } else if(totalErrors>active.length*2){
      lines.push('累计失败 '+totalErrors+' 次偏高，建议回顾相关知识点。');
    } else {
      lines.push('求助与试错行为总体健康，维持当前节奏。');
    }
    el.innerHTML=lines.join('<br>');
  }

})();
</script>
</body>
</html>
